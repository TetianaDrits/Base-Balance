<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><title>Base Node Balance</title>
<style>
  body { background: #111; color: #fff; font-family: sans-serif; text-align: center; }
  #box { position: relative; width: 400px; height: 300px; background: #222; margin: 20px auto; border: 2px solid #0052FF; }
  #bar { position: absolute; width: 200px; height: 12px; background: #0052FF; top: 180px; left: 100px; transform-origin: center; }
  #node { position: absolute; width: 24px; height: 24px; background: #00D395; border-radius: 50%; top: 156px; left: 188px; }
</style>
</head>
<body>
<h1>Base Node Balance</h1>
<p>Удерживай баланс узла кнопками [А] и [D] или Стрелками!</p>
<h2>Время удержания: <span id="time">0</span>s</h2>
<div id="box"><div id="bar"></div><div id="node"></div></div>
<script>
  let angle = 0, vel = 0, pos = 188, time = 0, active = true;
  document.addEventListener('keydown', e => {
    if(e.key === 'ArrowLeft' || e.key === 'a') vel -= 0.8;
    if(e.key === 'ArrowRight' || e.key === 'd') vel += 0.8;
  });
  setInterval(() => {
    if(!active) return;
    angle += vel;
    vel *= 0.95;
    pos += angle * 0.1;
    document.getElementById('bar').style.transform = `rotate(${angle}deg)`;
    document.getElementById('node').style.left = pos + 'px';
    if(pos < 100 || pos > 280 || Math.abs(angle) > 45) {
      active = false; alert('Узел упал! Итоговое время: ' + time + ' сек'); location.reload();
    }
    time += 0.1; document.getElementById('time').innerText = time.toFixed(1);
  }, 50);
</script>
</body>
</html>
